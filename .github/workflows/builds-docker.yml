          git cherry-pick 69e8df4a7f0a328b16b49476aaae0a558df66d33  # incusd/db/cluster: Accept prefetched instance config and profiles
          git cherry-pick ca10430366933b03f272fca6e2f2b5e49f0848ce  # incusd/scriptlet: Load instances in bulk
