          git cherry-pick d37221cca975a4d3f3654e31adb3a58c2abf8a15  # incusd/instance/qemu: Size the qcow2 L2 cache from the file size and memory limit
          git cherry-pick 41050e2ed806e5eb96c3c7aa5412ea0da0911c37  # incusd/cluster: Heal members that died during an evacuation
