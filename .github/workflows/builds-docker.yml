      - name: Build UI (canonical)
        run: |
          REPO="${PWD}"

          cd /build/incus-ui-canonical

          # Complete re-branding.
          find -type f -name "*.ts" -o -name "*.tsx" -o -name "*.scss" | xargs sed -i -f "${REPO}/patches/ui-canonical-renames.sed"

          npm install -g --prefix /root/.local yarn
          yarn install
          yarn build

          mkdir -p /usr/incus/ui-canonical/
          rsync -a /build/incus-ui-canonical/build/ui/ /usr/incus/ui-canonical/

      - name: Build Distrobuilder
        run: |
          cd /build/distrobuilder
          go build -o "/usr/incus/bin/distrobuilder" github.com/lxc/distrobuilder/distrobuilder

      - name: Build Incus Compose
        run: |
          cd /build/incus-compose
          go build -ldflags="-w -s -X github.com/lxc/incus-compose/cmd/incus-compose/version.Version=${INCUS_COMPOSE_TAG}" -o "/usr/incus/bin/incus-compose" github.com/lxc/incus-compose/cmd/incus-compose

      - name: Build CRIU
        run: |
          REPO="${PWD}"

          cd /build/criu

          make -j"$(nproc)" WERROR=0
          cp criu/criu /usr/incus/bin/

      - name: Build libnvidia-container
        run: |
          REPO="${PWD}"

          cd /build/libnvidia-container
          patch -p1 < "${REPO}/patches/nvidia-0001-Fix-for-22.04-build.patch"
          patch -p1 < "${REPO}/patches/nvidia-0002-pre-load-libdl.patch"
          make -j"$(nproc)" prefix=/

          mkdir /build/target/libnvidia-container
          DESTDIR=/build/target/libnvidia-container make install prefix=/
          rsync -a /build/target/libnvidia-container/bin/ /usr/incus/bin/
          rsync -a /build/target/libnvidia-container/include/ /usr/incus/include/
          rsync -a /build/target/libnvidia-container/lib/ /usr/incus/lib/

      - name: Build seabios
        run: |
          REPO="${PWD}"

          cd /build/seabios

          # Build a traditional seabios.
          make clean distclean
          echo "CONFIG_QEMU=y" > .config
          echo "CONFIG_QEMU_HARDWARE=y" >> .config
          echo "CONFIG_BOOTSPLASH=n" >> .config
          echo "CONFIG_ROM_SIZE=256" >> .config
          echo "CONFIG_XEN=n" >> .config
          echo "CONFIG_PVSCSI=n" >> .config
          echo "CONFIG_ESP_SCSI=n" >> .config
          echo "CONFIG_LSI_SCSI=n" >> .config
          echo "CONFIG_MEGASAS=n" >> .config
          echo "CONFIG_MPT_SCSI=n" >> .config
          echo "CONFIG_FLOPPY=n" >> .config
          echo "CONFIG_FLASH_FLOPPY=n" >> .config
          make oldnoconfig V=1
          make -j"$(nproc)" V=1 PYTHON=python3

          mkdir -p /usr/incus/share/qemu/
          cp out/bios.bin /usr/incus/share/qemu/seabios.bin

      - name: Build nasm
        run: |
          REPO="${PWD}"

          cd /build/nasm
          patch -p1 < "${REPO}/patches/nasm-0000-disable-manpages.patch"
          ./configure --prefix=/usr/incus
          make -j"$(nproc)"

          mkdir -p /build/target/nasm/
          DESTDIR=/build/target/nasm make install
          rsync -a /build/target/nasm/usr/incus/bin/ /usr/incus/bin/

      - name: Build EDK2
        run: |
          REPO="${PWD}"

          cd /build/edk2
          patch -p1 < "${REPO}/patches/edk2-0001-force-DUID-LLT.patch"
          cp "${REPO}/patches/edk2-0002-logo.bmp" MdeModulePkg/Logo/Logo.bmp
          patch -p1 < "${REPO}/patches/edk2-0003-boot-delay.patch"
          patch -p1 < "${REPO}/patches/edk2-0004-gcc-errors.patch"
          patch -p1 < "${REPO}/patches/edk2-0005-Revert-ArmVirtPkg-make-EFI_LOADER_DATA-non-executabl.patch"
          patch -p1 < "${REPO}/patches/edk2-0006-disable-EFI-memory-attributes-protocol.patch"
          patch -p1 < "${REPO}/patches/edk2-0007-OvmfPkg-X64-add-opt-org-tianocore-UninstallMemAttrProtocol-support.patch"
          patch -p1 < "${REPO}/patches/edk2-0008-Disable-virtio-keyboard.patch"
          patch -p1 < "${REPO}/patches/edk2-9999-disable-UEFI-shell-under-SecureBoot.patch"

          sed -i "s#02/02/2022#$(date +%m/%d/%Y)#g" OvmfPkg/SmbiosPlatformDxe/SmbiosPlatformDxe.c

          EDK2_ARCH="X64"
          EDK2_PKG="OvmfPkg/OvmfPkgX64.dsc"
          EDK2_FV_CODE="OVMF_CODE"
          EDK2_FV_VARS="OVMF_VARS"

          build_edk2() {
              TARGET_CODE="$1"
              shift
              TARGET_VARS="$1"
              shift

              set -ex
              (
              cat << EOF
                  . ./edksetup.sh
                  make -C BaseTools ARCH=${EDK2_ARCH}
                  build -a ${EDK2_ARCH} -t GCC -b RELEASE -p ${EDK2_PKG} \
                    -DSMM_REQUIRE=TRUE \
                    -DSECURE_BOOT_ENABLE=TRUE \
                    -DNETWORK_IP4_ENABLE=TRUE \
                    -DNETWORK_IP6_ENABLE=TRUE \
                    -DNETWORK_TLS_ENABLE=TRUE \
                    -DNETWORK_HTTP_BOOT_ENABLE=TRUE \
                    -DTPM2_ENABLE=TRUE \
                    -DTPM2_CONFIG_ENABLE=TRUE \
                    --pcd PcdUninstallMemAttrProtocol=TRUE \
                    $@
          EOF
              ) | bash -e

              cp Build/*/*/FV/${EDK2_FV_CODE}.fd "${TARGET_CODE}"
              cp Build/*/*/FV/${EDK2_FV_VARS}.fd "${TARGET_VARS}"
          }

          mkdir -p "/usr/incus/share/qemu/"
          build_edk2 \
            "/usr/incus/share/qemu/OVMF_CODE.4MB.fd" \
            "/usr/incus/share/qemu/OVMF_VARS.4MB.fd" \
            -DFD_SIZE_4MB

          ln -s OVMF_CODE.4MB.fd /usr/incus/share/qemu/OVMF_CODE.fd
          ln -s OVMF_VARS.4MB.fd /usr/incus/share/qemu/OVMF_VARS.fd

          # Unified (embedded variable store) firmware for AMD SEV.
          if [ "${EDK2_ARCH}" = "X64" ]; then
              touch OvmfPkg/AmdSev/Grub/grub.efi

              (
              cat << EOF
                  . ./edksetup.sh
                  build -a X64 -t GCC -b RELEASE -p OvmfPkg/AmdSev/AmdSevX64.dsc \
                    -DCC_MEASUREMENT_ENABLE=TRUE \
                    -DNETWORK_IP4_ENABLE=TRUE \
                    -DNETWORK_IP6_ENABLE=TRUE \
                    -DNETWORK_TLS_ENABLE=TRUE \
                    -DNETWORK_HTTP_BOOT_ENABLE=TRUE \
                    -DTPM2_ENABLE=TRUE
          EOF
              ) | bash -e

              cp Build/AmdSev/*/FV/OVMF.fd /usr/incus/share/qemu/OVMF.amdsev.fd
          fi

      - name: Build libtpms
        run: |
          REPO="${PWD}"

          cd /build/libtpms
          patch -p1 < "${REPO}/patches/libtpms-0001-Fix-a-compilation-error-in-TPMLIB_GetPlaintext.patch"

          ./autogen.sh
          ./configure --prefix=/usr/incus --with-tpm2 --with-openssl
          make -j"$(nproc)"

          mkdir -p /build/target/libtpms/
          DESTDIR=/build/target/libtpms make install
          rsync -a /build/target/libtpms/usr/incus/include/ /usr/incus/include/
          rsync -a /build/target/libtpms/usr/incus/lib/ /usr/incus/lib/

      - name: Build swtpm
        run: |
          cd /build/swtpm
          ./autogen.sh
          ./configure --prefix=/usr/incus --with-gnutls --with-seccomp --with-openssl --without-cuse
          make -j"$(nproc)"

          mkdir -p /build/target/swtpm/
          DESTDIR=/build/target/swtpm make install
          rsync -a /build/target/swtpm/usr/incus/bin/ /usr/incus/bin/
          rsync -a /build/target/swtpm/usr/incus/include/ /usr/incus/include/
          rsync -a /build/target/swtpm/usr/incus/lib/ /usr/incus/lib/

          mkdir -p /usr/incus/etc/
          cat > /usr/incus/etc/swtpm-localca.options << EOF
          --platform-manufacturer Incus
          --platform-version 2.1
          --platform-model QEMU
          EOF

      - name: Build virtiofsd
        run: |
          cd /build/virtiofsd
          cargo build --release
          cp target/release/virtiofsd /usr/incus/bin/

      - name: Build lego
        run: |
          cd /build/lego
          go build -o "/usr/incus/bin/lego" github.com/go-acme/lego/v4/cmd/lego

      - name: Build skopeo
        run: |
          cd /build/skopeo
          go build -o "/usr/incus/bin/skopeo" ./cmd/skopeo

      - name: Build TrueNAS Incus CTL
        run: |
          REPO="${PWD}"

          cd /build/truenas_incus_ctl

          patch -p1 < "${REPO}/patches/truenas-0001-bump-timeouts.patch"

          go build -o "/usr/incus/bin/truenas_incus_ctl" truenas/truenas_incus_ctl

      - name: Build virglrenderer
        if: ${{ env.OS_NAME == 'debian-13' || env.OS_NAME == 'debian-14' }}
        run: |
          cd /build/virglrenderer

          meson setup build \
                  --prefix=/usr/incus \
                  --libdir=/usr/incus/lib \
                  -Dplatforms=egl \
                  -Ddrm-renderers=amdgpu-experimental,asahi,msm,panfrost-experimental,i915-experimental
          meson compile -C build

          mkdir -p /build/target/virglrenderer/
          DESTDIR=/build/target/virglrenderer/ meson install -C build
          rsync -a /build/target/virglrenderer/usr/incus/include/ /usr/incus/include/
          rsync -a /build/target/virglrenderer/usr/incus/lib/ /usr/incus/lib/

      - name: Build QEMU
        run: |
          REPO="${PWD}"

          cd /build/qemu

          patch -p1 < "${REPO}/patches/qemu-0001-fdmon-io_uring-avoid-idle-event-loop-being-accounted.patch"

          sed -i "s/^unset target_list$/target_list=\"x86_64-softmmu\"/" configure

          sed -i "/subdir('tests')/d" meson.build

          opengl=""
          if [ "${OS_NAME}" = "debian-13" ] || [ "${OS_NAME}" = "debian-14" ]; then
            opengl="--enable-opengl --enable-virglrenderer"
          fi

          ./configure \
                  --prefix=/usr/incus \
                  --libexecdir=bin \
                  --libdir=lib \
                  --disable-bochs \
                  --disable-cloop \
                  --disable-dmg \
                  --disable-docs  \
                  --disable-fuse  \
                  --disable-guest-agent \
                  --disable-parallels \
                  --disable-qed \
                  --disable-slirp \
                  --disable-user \
                  --disable-vdi \
                  --disable-vnc \
                  --disable-xen \
                  --disable-install-blobs \
                  --enable-attr \
                  --enable-cap-ng \
                  --enable-kvm \
                  --enable-libusb \
                  --enable-usb-redir \
                  --enable-linux-aio \
                  --enable-linux-io-uring \
                  --enable-numa \
                  --enable-pie \
                  --enable-png \
                  --enable-rbd \
                  --enable-seccomp \
                  --enable-spice \
                  --enable-system \
                  --enable-tcg \
                  --enable-tools \
                  --enable-vhost-crypto \
                  --enable-vhost-kernel \
                  --enable-vhost-net \
                  --enable-vhost-user \
                  --enable-virtfs \
                  ${opengl}
          make -j"$(nproc)"

          mkdir /build/target/qemu/
          DESTDIR=/build/target/qemu/ make install
          rsync -a /build/target/qemu/usr/incus/bin/ /usr/incus/bin/
          rsync -a /build/target/qemu/usr/incus/lib/ /usr/incus/lib/
          rsync -a /build/target/qemu/usr/incus/share/qemu/ /usr/incus/share/qemu/
          cp /build/qemu/pc-bios/kvmvapic.bin /usr/incus/share/qemu/
          cp /build/qemu/pc-bios/vgabios-qxl.bin /usr/incus/share/qemu/
          cp /build/qemu/pc-bios/vgabios-virtio.bin /usr/incus/share/qemu/
          cp /build/qemu/pc-bios/efi-e1000e.rom /usr/incus/share/qemu/
          cp /build/qemu/pc-bios/efi-virtio.rom /usr/incus/share/qemu/
          cp /build/qemu/pc-bios/efi-vmxnet3.rom /usr/incus/share/qemu/

      - name: Build Secure Boot firmware
        run: |
          REPO="${PWD}"

          cd /build/edk2

          FIRMWARE="OVMF"

          cd "${REPO}/edk2-vars-generator"
          ./edk2-vars-generator -f "${FIRMWARE}" \
            -e /build/edk2/Build/*/*/*/EnrollDefaultKeys.efi \
            -s /build/edk2/Build/*/*/*/Shell.efi \
            -c "/usr/incus/share/qemu/OVMF_CODE.4MB.fd" \
            -V "/usr/incus/share/qemu/OVMF_VARS.4MB.fd" \
            -C "$(cat ${REPO}/zabbly-sb.oem.crt)" \
            -o "/usr/incus/share/qemu/OVMF_VARS.4MB.ms.fd"

      - name: Strip and cleanup binaries
        run: |
          rm -Rf /usr/incus/lib/debug/
          rm -Rf /usr/incus/include/
          rm -Rf /usr/incus/lib/pkgconfig/
          rm /usr/incus/lib/*.a /usr/incus/lib/*.la /usr/incus/lib/*/*.a /usr/incus/lib/*/*.la

          rm /usr/incus/bin/nasm
          rm /usr/incus/bin/ndisasm
          rm /usr/incus/bin/qemu-bridge-helper
          rm /usr/incus/bin/qemu-edid
          rm /usr/incus/bin/qemu-io
          rm /usr/incus/bin/qemu-pr-helper
          rm /usr/incus/bin/qemu-storage-daemon
          rm /usr/incus/share/qemu/trace-events-all

          strip /usr/incus/agent/*linux*
          strip /usr/incus/bin/*
          strip /usr/incus/lib/*so*

      - name: Make a Debian package
        env:
          PKGOS: "debian-14"
        run: |
          [ "${PKGOS}" = "debian-12" ] && CODENAME=bookworm
          [ "${PKGOS}" = "debian-13" ] && CODENAME=trixie
          [ "${PKGOS}" = "debian-14" ] && CODENAME=forky
          [ "${PKGOS}" = "ubuntu-22.04" ] && CODENAME=jammy
          [ "${PKGOS}" = "ubuntu-24.04" ] && CODENAME=noble
          [ "${PKGOS}" = "ubuntu-26.04" ] && CODENAME=resolute

          mkdir -p \
            pkg/ \
            pkg/etc \
            pkg/lib/systemd/system/ \
            pkg/usr/ \
            pkg/usr/bin/ \
            pkg/usr/lib/sysctl.d/ \
            pkg/usr/share/bash-completion/completions/ \
            pkg/usr/share/fish/vendor_completions.d/ \
            pkg/usr/share/zsh/vendor-completions/

          cp -R debian pkg/debian
          cp -R bin/* pkg/usr/bin/
          cp -R /usr/incus pkg/usr/
          cp -R etc/* pkg/etc/

          cp -R systemd/system/* pkg/lib/systemd/system/
          cp -R systemd/wrappers/* pkg/usr/incus/lib/systemd/
          cp -R systemd/sysctl.d/* pkg/usr/lib/sysctl.d/

          ln -s /usr/incus/share/completions/bash pkg/usr/share/bash-completion/completions/incus
          ln -s /usr/incus/share/completions/fish pkg/usr/share/fish/vendor_completions.d/incus.fish
          ln -s /usr/incus/share/completions/zsh pkg/usr/share/zsh/vendor-completions/_incus

          ln -s /usr/incus/bin/fuidshift pkg/usr/bin/fuidshift
          ln -s /usr/incus/bin/incus-simplestreams pkg/usr/bin/incus-simplestreams
          ln -s /usr/incus/bin/incus-benchmark pkg/usr/bin/incus-benchmark

          mkdir -p pkg/var/lib/incus
          chmod 711 pkg/var/lib/incus

          mkdir -p pkg/var/log/incus
          chmod 700 pkg/var/log/incus

          mkdir -p pkg/usr/share/locale
          for i in /usr/incus/share/locale/*.mo; do
            LANG=$(echo $i | sed -e "s#.*/locale/##g" -e "s#.mo\$##g")
            mkdir -p pkg/usr/share/locale/${LANG}/LC_MESSAGES
            ln -s ${i} pkg/usr/share/locale/${LANG}/LC_MESSAGES/incus.mo
          done

          cd pkg

          if [ "${PKGOS}" = "debian-13" ] || [ "${PKGOS}" = "ubuntu-24.04" ] || [ "${PKGOS}" = "debian-14" ]; then
            sed -i debian/control \
              -e "s/LIBPNG16/libpng16-16t64/g" \
              -e "s/LIBUSBREDIRPARSER1/libusbredirparser1t64/g" \
              -e "s/LIBAIO1/libaio1t64/g" \
              -e "s/LIBBTRFS0/libbtrfs0t64/g" \
              -e "s/LIBUV1/libuv1t64/g"

            if [ "${PKGOS}" = "debian-14" ]; then
              sed -i debian/control \
                -e "s/LIBGPGME11/libgpgme45/g"
            else
              sed -i debian/control \
                -e "s/LIBGPGME11/libgpgme11t64/g"
            fi
          else
            sed -i debian/control \
              -e "s/LIBPNG16/libpng16-16/g" \
              -e "s/LIBUSBREDIRPARSER1/libusbredirparser1/g" \
              -e "s/LIBAIO1/libaio1/g" \
              -e "s/LIBBTRFS0/libbtrfs0/g" \
              -e "s/LIBGPGME11/libgpgme11/g" \
              -e "s/LIBUV1/libuv1/g"
          fi

          if [ "${PKGOS}" = "debian-13" ] || [ "${PKGOS}" = "debian-14" ]; then
            sed -i debian/control \
              -e "s/LIBFUSE3/libfuse3-4/g"
          else
            sed -i debian/control \
              -e "s/LIBFUSE3/libfuse3-3/g"
          fi

          if [ "${PKGOS}" = "debian-14" ]; then
            sed -i debian/control \
              -e "s/LIBNET1/libnet9/g"
          else
            sed -i debian/control \
              -e "s/LIBNET1/libnet1/g"
          fi

          if [ "${PKGOS}" = "debian-13" ] || [ "${PKGOS}" = "debian-14" ]; then
            sed -i debian/control \
              -e "s/^  LIBVIRGL,$/  libdrm-amdgpu1,\n  libdrm2,\n  libegl1,\n  libepoxy0,\n  libgbm1,/"
            echo "usr/incus/lib/libvirglrenderer.so*" >> debian/incus.install
          else
            sed -i debian/control \
              -e "/^  LIBVIRGL,$/d"
          fi

          dch --package incus --create -D ${CODENAME} -M -m "Automated Incus stable build" -v 1:$(echo ${INCUS_TAG} | sed -e "s/v//" -e "s/.0$//")-$(echo ${PKGOS} | sed "s/-//g")-$(date -u +%Y%m%d%H%M)~deb14 --force-distribution
          dpkg-buildpackage -b

          cd ..
          mkdir out
          mv incus_* out/
          mv incus-base_* out/
          mv incus-client_* out/
          mv incus-extra_* out/
          mv incus-ui-canonical_* out/

      - name: Upload resulting build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debian-forky-amd64
          path: out/*

  release:
    if: github.repository == 'frostyard/incus' && github.ref == 'refs/heads/stable'
    runs-on: ubuntu-latest
    needs: build-incus
    timeout-minutes: 20
    permissions:
      contents: write # create the release and its tag
      attestations: write # store the build provenance attestations
      id-token: write # sign the attestations with this workflow's identity
    outputs:
      tag: ${{ steps.check.outputs.tag }}

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: debian-trixie-amd64
          path: ./dist

      # apt-publisher publishes every .deb in the release to the codenames
      # the request names, in the image component, and this Debian 13 version
      # carries no ~deb13 marker. The release must therefore hold exactly one
      # complete Debian 13 amd64 build, and nothing else.
      - name: Check the packages
        id: check
        run: |
          set -euo pipefail
          shopt -s nullglob
          want="incus incus-base incus-client incus-extra incus-ui-canonical"
          version="" names=()
          for deb in dist/*.deb; do
            name=$(dpkg-deb -f "$deb" Package)
            arch=$(dpkg-deb -f "$deb" Architecture)
            v=$(dpkg-deb -f "$deb" Version)
            size=$(stat -c %s "$deb")
            if [[ $arch != amd64 ]]; then
              echo "::error::$deb is built for $arch, not amd64"
              exit 1
            fi
            if [[ ! $v =~ ^1:[0-9][0-9.]*-debian13-[0-9]{12}$ ]]; then
              echo "::error::$deb has version $v, which is not a Debian 13 build"
              exit 1
            fi
            if [[ -n $version && $v != "$version" ]]; then
              echo "::error::$deb has version $v, but another package has $version"
              exit 1
            fi
            if ((size >= 2147483648)); then
              echo "::error::$deb is $size bytes; GitHub release assets must be under 2 GiB"
              exit 1
            fi
            version=$v
            names+=("$name")
          done
          got=$(printf '%s\n' "${names[@]}" | sort | paste -sd ' ')
          if [[ $got != "$want" ]]; then
            echo "::error::expected the packages: $want; found: ${got:-none}"
            exit 1
          fi
          echo "tag=${version#1:}" >>"$GITHUB_OUTPUT"

      # Binds each .deb to this workflow run. Verify with
      # gh attestation verify FILE --repo frostyard/incus --source-ref refs/heads/stable
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.deb

      # gh uploads the assets to a draft and publishes it once all are
      # attached, so apt-publisher never sees a partial release. An existing
      # tag fails this step instead of changing a published release.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.deb --target "$GITHUB_SHA" --latest \
            --title "Incus $TAG" \
            --notes "Debian 13 (trixie) amd64 build of stable at $GITHUB_SHA. frostyard/apt-publisher publishes it to https://repository.frostyard.org/debian/ (trixie, component image)."

  # Not continue-on-error: if the request fails, nothing was published and
  # the run must fail. Re-running this job alone requests the same release
  # again. codenames is explicit because these are Debian 13 builds whose
  # version carries no ~deb13 marker. The payload names no component:
  # apt-publisher puts this repository's packages in the component it is
  # registered for, image (core ADR-0059).
  request-publication:
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Request APT publication
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.APT_PUBLISH_TOKEN }}
          repository: frostyard/apt-publisher
          event-type: publish-deb
          client-payload: '{"repo": "${{ github.repository }}", "tag": "${{ needs.release.outputs.tag }}", "codenames": ["trixie"]}'

  # The Debian 14 (forky) release: separate from release so that a forky
  # failure never blocks the trixie release.
  release-forky:
    if: github.repository == 'frostyard/incus' && github.ref == 'refs/heads/stable'
    runs-on: ubuntu-latest
    needs: build-incus-forky
    timeout-minutes: 20
    permissions:
      contents: write # create the release and its tag
      attestations: write # store the build provenance attestations
      id-token: write # sign the attestations with this workflow's identity
    outputs:
      tag: ${{ steps.check.outputs.tag }}

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: debian-forky-amd64
          path: ./dist

      # apt-publisher publishes every .deb in the release, and it publishes a
      # ~deb14 version to forky only. The release must therefore hold exactly
      # one complete Debian 14 amd64 build, and nothing else.
      - name: Check the packages
        id: check
        run: |
          set -euo pipefail
          shopt -s nullglob
          want="incus incus-base incus-client incus-extra incus-ui-canonical"
          version="" names=()
          for deb in dist/*.deb; do
            name=$(dpkg-deb -f "$deb" Package)
            arch=$(dpkg-deb -f "$deb" Architecture)
            v=$(dpkg-deb -f "$deb" Version)
            size=$(stat -c %s "$deb")
            if [[ $arch != amd64 ]]; then
              echo "::error::$deb is built for $arch, not amd64"
              exit 1
            fi
            if [[ ! $v =~ ^1:[0-9][0-9.]*-debian14-[0-9]{12}~deb14$ ]]; then
              echo "::error::$deb has version $v, which is not a Debian 14 build"
              exit 1
            fi
            if [[ -n $version && $v != "$version" ]]; then
              echo "::error::$deb has version $v, but another package has $version"
              exit 1
            fi
            if ((size >= 2147483648)); then
              echo "::error::$deb is $size bytes; GitHub release assets must be under 2 GiB"
              exit 1
            fi
            version=$v
            names+=("$name")
          done
          got=$(printf '%s\n' "${names[@]}" | sort | paste -sd ' ')
          if [[ $got != "$want" ]]; then
            echo "::error::expected the packages: $want; found: ${got:-none}"
            exit 1
          fi
          # A git tag cannot contain ~, so the tag is the version without its
          # epoch and without the ~deb14 suffix, for example
          # 7.6-debian14-202611131200.
          v=${version#1:}
          echo "tag=${v%~deb14}" >>"$GITHUB_OUTPUT"

      # Binds each .deb to this workflow run. Verify with
      # gh attestation verify FILE --repo frostyard/incus --source-ref refs/heads/stable
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.deb

      # --latest=false: the trixie release stays the latest, because trixie
      # stays the default codename.
      # gh uploads the assets to a draft and publishes it once all are
      # attached, so apt-publisher never sees a partial release. An existing
      # tag fails this step instead of changing a published release.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.deb --target "$GITHUB_SHA" --latest=false \
            --title "Incus $TAG" \
            --notes "Debian 14 (forky) amd64 build of stable at $GITHUB_SHA. frostyard/apt-publisher publishes it to https://repository.frostyard.org/debian/ (forky, component image)."

  # Not continue-on-error: if the request fails, nothing was published and
  # the run must fail. Re-running this job alone requests the same release
  # again. codenames names forky explicitly because the trixie version
  # carries no ~deb13 marker; the forky version's ~deb14 marker is what
  # publishes it to forky alone. The payload names no component:
  # apt-publisher puts this repository's packages in the component it is
  # registered for, image (core ADR-0059).
  request-publication-forky:
    runs-on: ubuntu-latest
    needs: release-forky
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Request APT publication
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.APT_PUBLISH_TOKEN }}
          repository: frostyard/apt-publisher
          event-type: publish-deb
          client-payload: '{"repo": "${{ github.repository }}", "tag": "${{ needs.release-forky.outputs.tag }}", "codenames": ["forky"]}'
